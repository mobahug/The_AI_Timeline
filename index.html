    <!-- The two faces are served from this site. They used to come from a
         Google stylesheet, which is a render-blocking request to a third party
         on all 318 pages before a single word can be drawn, and a reflow when
         the faces land after it. They are declared here rather than in the
         stylesheet so they are known to the browser in the first bytes of the
         document, and the two regulars are preloaded — `crossorigin` because a
         font is fetched in CORS mode even from its own origin, and without it
         the file is downloaded twice.

         Latin and latin-extended subsets of each: the board sets names like
         Karel Čapek, and the extended file is only fetched on a page that
         needs one. Both families are SIL OFL 1.1; the licences sit beside the
         files in public/fonts. -->
    <link rel="preload" href="%BASE_URL%fonts/instrument-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
