name: Validate data

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Source rot is a data-accuracy bug, but it is caused by the outside world,
      # so it reports without failing the build.
      - run: npm run check:links
        continue-on-error: true
